<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean fixture</title>
<style>
  :root { --page: #ffffff; --ink: #1c2321; --quiet: #55605c; --line: #d4dad7; --accent: #0b6e4f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: Verdana, sans-serif; font-size: 17px; line-height: 1.55; }
  main { max-width: 68ch; margin: 0 auto; padding: 48px 20px 96px; }
  h1 { font-size: 40px; line-height: 1.1; margin: 0 0 16px; text-wrap: balance; }
  h2 { font-size: 24px; line-height: 1.2; margin: 48px 0 12px; }
  p { margin: 0 0 16px; color: var(--ink); }
  .quiet { color: var(--quiet); }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label { display: block; font-weight: 700; margin-bottom: 6px; }
  input { font: inherit; width: 100%; padding: 12px; border: 1px solid #6b7672; border-radius: 4px; min-height: 48px; }
  button { font: inherit; font-weight: 700; margin-top: 16px; min-height: 48px; padding: 12px 20px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; transition: background-color .15s ease-out; }
  button:hover { background: #095c42; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Saturday market pickup</h1>
  <p>Order by Thursday noon and collect your box at the stall between eight and one. We pack it the same morning.</p>
  <h2>This week's box</h2>
  <table>
    <thead><tr><th>Item</th><th class="n">Weight</th></tr></thead>
    <tbody><tr><td>New potatoes</td><td class="n">1.5 kg</td></tr><tr><td>Rye loaf</td><td class="n">800 g</td></tr><tr><td>Curd cheese</td><td class="n">400 g</td></tr></tbody>
  </table>
  <h2>Reserve a box</h2>
  <p class="quiet">We only use your number to text you if something is out of stock.</p>
  <form>
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="name">
    <button type="submit">Reserve box</button>
  </form>
</main>
</body>
</html>
