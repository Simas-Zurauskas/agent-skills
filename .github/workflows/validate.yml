name: validate
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Skills follow the spec and are listed in the marketplace
        run: python3 scripts/validate.py
      - name: No secrets committed
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact
